spring:
  application:
    name: trileaf-monitor

trileaf:
  monitor:
    panel:
      MCSManager:
        - vendor: 供应商1
          panelVersion: 0.0.1
          baseUrl: http://211.154.16.45:23333 # 基础URL
          apiKey: 658173b28adc43c2b4032312bd88fdf8 # API密钥
          # 所有API路径的集合
          apiPaths:
            # 所有API请求的基础前缀
            prefix: /api
            # 获取概览信息的API路径
            overview: /overview
            # 获取用户列表的API路径
            userList: /auth/search
            # 获取实例列表的API路径
            instancesList: /service/remote_service_instances
            # 获取特定实例详情的API路径
            instanceDetail: /instance
            # 获取文库列表的API路径
            fileList: /files/list
            # 获取文件内容的API路径
            fileContent: /files
            # 解压文件的API路径
            decompress: /files/compress
        - vendor: 供应商2
          baseUrl: http://211.154.16.45:23333 # 基础URL
          apiKey: 658173b28adc43c2b4032312bd88fdf8 # API密钥
          # 所有API路径的集合
          apiPaths:
            # 所有API请求的基础前缀
            prefix: /api
            # 获取概览信息的API路径
            overview: /overview
            # 获取用户列表的API路径
            userList: /auth/search
            # 获取实例列表的API路径
            instancesList: /service/remote_service_instances
            # 获取特定实例详情的API路径
            instanceDetail: /instance
            # 获取文库列表的API路径
            fileList: /files/list
            # 获取文件内容的API路径
            fileContent: /files
            # 解压文件的API路径
