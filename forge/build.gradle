// ========== 插件配置 ==========
plugins {
                        // Eclipse IDE 支持
    id 'idea'                         // IntelliJ IDEA 支持
    id 'maven-publish'                // Maven 发布支持
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'  // Forge Gradle 插件
}

// ========== 仓库配置 ==========
repositories {
    maven { url = "https://maven.minecraftforge.net/" }      // Forge 官方仓库
    maven { url = "https://libraries.minecraft.net/" }       // Mojang 官方库
    maven { url = "https://repo.spongepowered.org/repository/maven-public/" }  // Sponge 仓库
    mavenCentral()  // Maven 中央仓库（可选但推荐）
}

// ========== 项目基本信息 ==========
version = '1.0'                        // 项目版本号
group = 'cn.sanyeyun'                 // 项目组ID
base {
    archivesName = 'trileaf-monitor-forge'   // 输出文件名
}

// ========== Java 配置 ==========
// 1.18+ 版本使用 Java 17，所以你的 mod 应该以 Java 17 为目标
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// 打印当前 Java 环境信息
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// ========== Minecraft 配置 ==========
minecraft {
    // 映射配置（可以是 official 或 parchment）
    mappings channel: 'official', version: '1.20.1'

    // 启用 IDE 资源复制（必须为 true）
    copyIdeResources = true

    // 运行配置
    runs {
        // 所有运行配置的通用设置
        configureEach {
            workingDirectory project.file('run')  // 工作目录

            // 日志标记配置
            property 'forge.logging.markers', 'REGISTRIES'

            // 控制台日志级别
            property 'forge.logging.console.level', 'debug'

            // Mod 源集配置
            mods {
                trileaf {
                    source sourceSets.main
                }
            }
        }

        // 客户端运行配置
        client {
            property 'forge.enabledGameTestNamespaces', 'trileaf'
        }

        // 服务端运行配置
        server {
            property 'forge.enabledGameTestNamespaces', 'trileaf'
            args '--nogui'  // 无 GUI 模式
        }

        // 游戏测试服务器配置
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'trileaf'
        }

        // 数据生成配置
        data {
            workingDirectory project.file('run-data')
            args '--mod', 'trileaf', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// 包含数据生成器生成的资源
sourceSets.main.resources { srcDir 'src/generated/resources' }

// ========== 依赖配置 ==========
dependencies {
    // Forge 主依赖
    minecraft "net.minecraftforge:forge:1.20.1-47.0.0"

    // Lombok 依赖（编译时注解处理）
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // 子模块依赖
    implementation project(":common")
}

// ========== 资源处理 ==========
tasks.named('processResources', ProcessResources).configure {
    // 定义要替换的属性
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    // 处理模组元数据文件
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// ========== JAR 包配置 ==========
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'  // 最终执行重混淆任务

    // 包含 common 模块的输出（多项目构建时需要）
    from project(':common').sourceSets.main.output
    
    // 显式设置重复文件处理策略
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ========== 发布配置 ==========
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar  // 发布 JAR 文件
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"  // 本地 Maven 仓库路径
        }
    }
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// ========== 编译配置 ==========
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'  // 使用 UTF-8 编译
}