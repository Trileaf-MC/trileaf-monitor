plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// 添加依赖仓库
repositories {
    maven { url = "https://maven.minecraftforge.net/" } // Forge 官方仓库
    maven { url = "https://libraries.minecraft.net/" }   // Minecraft 原版库
    maven { url = "https://repo.spongepowered.org/repository/maven-public/" } // Sponge 仓库
    mavenCentral() // 中央仓库（可选但建议添加）
}

// Minecraft 配置（建议只保留一个 minecraft 块）
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.enabledGameTestNamespaces', 'trileaf'

            mods {
                trileaf {
                    source sourceSets.main
                    // ✅ 添加 common 模块的输出
                    source project(':common').sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.enabledGameTestNamespaces', 'trileaf'
            args '--nogui'

            mods {
                trileaf {
                    source sourceSets.main
                    // ✅ 添加 common 模块的输出
                    source project(':common').sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', 'trileaf', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                trileaf {
                    source sourceSets.main
                    // ✅ 添加 common 模块的输出
                    source project(':common').sourceSets.main
                }
            }
        }
    }
}

// 设置生成资源路径
sourceSets.main.resources { srcDir 'src/generated/resources' }

// 项目版本和分组 ID
version = '1.0'
group = 'cn.sanyeyun'

// 输出文件基础配置
base {
    archivesName = 'trileaf-monitor'
}

// 使用 Java 17 编译
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// 控制台输出环境信息
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// 依赖项配置
dependencies {
    // Forge 开发版本
    minecraft "net.minecraftforge:forge:1.20.1-47.0.0"

    // lombok（简化代码编写）
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // 添加 common 子模块的依赖
    implementation project(":common")
}

// 构建资源时自动替换字段
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// 设置 Jar 包 Manifest 信息
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar' // 构建完成后进行混淆
}

// Maven 发布配置（本地文件夹）
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

// 设置 Java 编译参数（UTF-8 编码）
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 将 common 模块的 class 文件打包到主 Jar 文件中（解决类找不到问题）
jar {
    from project(':common').sourceSets.main.output
}